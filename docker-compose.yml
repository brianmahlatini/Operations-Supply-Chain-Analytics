services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: operations_analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d operations_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://analytics:analytics_password@db:5432/operations_analytics
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8002/api
    ports:
      - "5175:5175"
    depends_on:
      - backend

volumes:
  postgres_data:
